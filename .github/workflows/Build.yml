name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zip

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Linux x64
        run: |
          cmake --build build --config Release --parallel

      - name: Package Linux artifact
        run: |
          cd build
          zip -r ../dumper-linux-x64.zip . 
          cd ..

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dumper-linux-x64
          path: dumper-linux-x64.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Ninja
        run: |
          choco install ninja -y

      - name: Configure CMake with Ninja
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows x64
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows artifact
        shell: powershell
        run: |
          Compress-Archive -Path .\build\* -DestinationPath .\dumper-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dumper-windows-x64
          path: dumper-windows-x64.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dumper-linux-x64
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dumper-windows-x64
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            release/dumper-linux-x64.zip
            release/dumper-windows-x64.zip
          generate_release_notes: true
